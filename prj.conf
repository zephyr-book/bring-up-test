CONFIG_SENSOR=y
CONFIG_SHELL=y

CONFIG_PWM=y
CONFIG_PWM_RPI_PICO=y

CONFIG_ASSERT=y

CONFIG_SPI=y

CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_GPIO_SHELL=y

CONFIG_MAIN_STACK_SIZE=5200
CONFIG_SHELL_STACK_SIZE=5200

# Display: on P1 the OLED hangs off a bit-bang SPI bus and is driven by the
# out-of-tree oled-sh1106-zephyr module, enabled in
# boards/zbook_rp2350b_m33_p1.conf. On P2 the same panel is a plain I2C device
# handled by Zephyr's in-tree ssd1306 driver, which auto-enables from the
# devicetree, so only the subsystems need turning on here.
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y

# Rotary encoder (P2) reports through the input subsystem via gpio-qdec.
CONFIG_INPUT=y
# ...but not through input_gpio_keys, which is `default y` on any gpio-keys node
# and static-asserts that every child carries a zephyr,code. The board's
# gpio-keys nodes (buttons, hall, card-detect, IR receiver, encoder switch) are
# deliberately plain GPIOs read with GPIO_DT_SPEC_GET, so the driver must stay
# off or it claims them all and fails the build.
CONFIG_INPUT_GPIO_KEYS=n

# Wi-Fi / networking lives on the zbook_wifi shield:
#   west build -b zbook/rp2350b/m33 --shield zbook_wifi
# Add persistent credentials by composing the upstream snippet:
#   west build -b zbook/rp2350b/m33 --shield zbook_wifi -S wifi-credentials
